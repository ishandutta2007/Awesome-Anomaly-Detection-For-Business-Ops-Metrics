<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <!-- Accent Glow Gradients -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.18); opacity: 1; }
    }
    .anomaly-pulse {
      animation: pulse 2s infinite ease-in-out;
      transform-origin: 920px 90px;
    }
    .grid-line { stroke: #1f2937; stroke-width: 1; stroke-opacity: 0.5; }
    .title-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; fill: #ffffff; }
    .subtitle-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; fill: #9ca3af; }
    .badge-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 13px; }
  </style>

  <!-- Background -->
  <rect width="1200" height="350" fill="url(#bgGrad)" rx="16"/>

  <!-- Background Grid Lines -->
  <g class="grid">
    <line x1="100" y1="0" x2="100" y2="350" class="grid-line"/>
    <line x1="300" y1="0" x2="300" y2="350" class="grid-line"/>
    <line x1="500" y1="0" x2="500" y2="350" class="grid-line"/>
    <line x1="700" y1="0" x2="700" y2="350" class="grid-line"/>
    <line x1="900" y1="0" x2="900" y2="350" class="grid-line"/>
    <line x1="1100" y1="0" x2="1100" y2="350" class="grid-line"/>
    
    <line x1="0" y1="70" x2="1200" y2="70" class="grid-line"/>
    <line x1="0" y1="140" x2="1200" y2="140" class="grid-line"/>
    <line x1="0" y1="210" x2="1200" y2="210" class="grid-line"/>
    <line x1="0" y1="280" x2="1200" y2="280" class="grid-line"/>
  </g>

  <!-- Graphic Visualization (Right Side) -->
  <g opacity="0.85">
    <!-- Area under metric curve -->
    <path d="M 650 240 Q 720 230, 780 250 T 880 210 T 920 90 T 980 240 T 1150 230 L 1150 310 L 650 310 Z" fill="url(#chartGrad)"/>
    
    <!-- Normal Metric Time Series Line -->
    <path d="M 650 240 Q 720 230, 780 250 T 880 210 T 920 90 T 980 240 T 1150 230" fill="none" stroke="#06b6d4" stroke-width="4"/>
    
    <!-- Upper Threshold Bound Line -->
    <line x1="650" y1="140" x2="1150" y2="140" stroke="#374151" stroke-width="2" stroke-dasharray="6 6"/>
    
    <!-- Lower Threshold Bound Line -->
    <line x1="650" y1="280" x2="1150" y2="280" stroke="#374151" stroke-width="2" stroke-dasharray="6 6"/>

    <!-- Vertical Anomaly Indicator Line -->
    <line x1="920" y1="90" x2="920" y2="300" stroke="#ec4899" stroke-width="2" stroke-dasharray="4 4"/>
    
    <!-- Anomaly Point Circle & Pulse -->
    <g class="anomaly-pulse">
      <circle cx="920" cy="90" r="16" fill="none" stroke="#ec4899" stroke-width="2.5"/>
      <circle cx="920" cy="90" r="7" fill="#ec4899"/>
    </g>

    <!-- Floating Anomaly Alert Box -->
    <g transform="translate(935, 60)">
      <rect width="185" height="38" rx="8" fill="#1e1b4b" stroke="#ec4899" stroke-width="1.5"/>
      <text x="12" y="24" class="badge-text" fill="#f43f5e">⚠️ ANOMALY DETECTED</text>
    </g>
  </g>

  <!-- Foreground Text & Branding (Left Side) -->
  <g transform="translate(60, 0)">
    <!-- Category Tag Badge -->
    <g transform="translate(0, 50)">
      <rect width="270" height="32" rx="16" fill="url(#cyanGlow)" stroke="#0891b2" stroke-width="1"/>
      <text x="16" y="21" class="badge-text" fill="#cffafe">⚡ AIOPS &amp; OBSERVABILITY ECOSYSTEM</text>
    </g>

    <!-- Main Title Text -->
    <text x="0" y="135" class="title-text" font-size="38">
      <tspan x="0" dy="0" fill="#ffffff">Awesome Anomaly Detection</tspan>
      <tspan x="0" dy="48" fill="#06b6d4">For Business Ops Metrics 📈🔍</tspan>
    </text>

    <!-- Subtitle Text -->
    <text x="0" y="235" class="subtitle-text" font-size="16">
      <tspan x="0" dy="0">Curated Directory of KPI Monitors, Time-Series Outlier Engines,</tspan>
      <tspan x="0" dy="26">Root Cause Analysis &amp; Open-Source Alerting Pipelines.</tspan>
    </text>

    <!-- Feature Badges/Pills -->
    <g transform="translate(0, 285)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="140" height="30" rx="6" fill="#1f2937" stroke="#374151"/>
      <text x="14" y="20" class="badge-text" fill="#9ca3af">📊 Time-Series AI</text>

      <!-- Pill 2 -->
      <rect x="152" y="0" width="145" height="30" rx="6" fill="#1f2937" stroke="#374151"/>
      <text x="166" y="20" class="badge-text" fill="#9ca3af">🎯 Business KPIs</text>

      <!-- Pill 3 -->
      <rect x="309" y="0" width="175" height="30" rx="6" fill="#1f2937" stroke="#374151"/>
      <text x="323" y="20" class="badge-text" fill="#9ca3af">🔓 Open-Source &amp; SaaS</text>
    </g>
  </g>
</svg>
