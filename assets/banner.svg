<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <!-- Accent Glow Gradients -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="pinkGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Drop Shadow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="anomalyGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 15px #ec4899); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -80; }
    }
    .anomaly-point {
      animation: pulse 2s infinite ease-in-out;
      transform-origin: 920px 90px;
    }
    .grid-line { stroke: #1f2937; stroke-width: 1; stroke-opacity: 0.5; }
    .title-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; fill: #ffffff; }
    .subtitle-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; fill: #9ca3af; }
    .badge-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 13px; }
  </style>

  <!-- Background -->
  <rect width="1200" height="350" fill="url(#bgGrad)" rx="16"/>

  <!-- Background Grid -->
  <g class="grid">
    <line x1="100" y1="0" x2="100" y2="350" class="grid-line"/>
    <line x1="300" y1="0" x2="300" y2="350" class="grid-line"/>
    <line x1="500" y1="0" x2="500" y2="350" class="grid-line"/>
    <line x1="700" y1="0" x2="700" y2="350" class="grid-line"/>
    <line x1="900" y1="0" x2="900" y2="350" class="grid-line"/>
    <line x1="1100" y1="0" x2="1100" y2="350" class="grid-line"/>
    
    <line x1="0" y1="70" x2="1200" y2="70" class="grid-line"/>
    <line x1="0" y1="140" x2="1200" y2="140" class="grid-line"/>
    <line x1="0" y1="210" x2="1200" y2="210" class="grid-line"/>
    <line x1="0" y1="280" x2="1200" y2="280" class="grid-line"/>
  </g>

  <!-- Animated Time Series Graphs in Background Right side -->
  <g opacity="0.6">
    <!-- Area under metric curve -->
    <path d="M 650 240 Q 720 230, 780 250 T 880 210 T 920 90 T 980 240 T 1150 230 L 1150 310 L 650 310 Z" fill="url(#chartGrad)"/>
    
    <!-- Normal Metric Time Series Wave -->
    <path d="M 650 240 Q 720 230, 780 250 T 880 210 T 920 90 T 980 240 T 1150 230" fill="none" stroke="#06b6d4" stroke-width="3.5" filter="url(#glow)"/>
    
    <!-- Threshold Upper Bound Line -->
    <path d="M 650 140 H 1150" fill="none" stroke="#374151" stroke-width="2" stroke-dasharray="6 6"/>
    
    <!-- Threshold Lower Bound Line -->
    <path d="M 650 280 H 1150" fill="none" stroke="#374151" stroke-width="2" stroke-dasharray="6 6"/>

    <!-- Anomaly Spike Signal Callout -->
    <line x1="920" y1="90" x2="920" y2="300" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7"/>
    
    <!-- Anomaly Radar/Pulse Circle -->
    <g class="anomaly-point">
      <circle cx="920" cy="90" r="16" fill="none" stroke="#ec4899" stroke-width="2" filter="url(#anomalyGlow)"/>
      <circle cx="920" cy="90" r="7" fill="#ec4899" filter="url(#anomalyGlow)"/>
    </g>

    <!-- Floating Anomaly Alert Tag -->
    <g transform="translate(940, 65)">
      <rect width="130" height="34" rx="8" fill="#1e1b4b" stroke="#ec4899" stroke-width="1.5" filter="url(#glow)"/>
      <text x="15" y="21" class="badge-text" fill="#f43f5e">⚠️ ANOMALY DETECTED</text>
    </g>
  </g>

  <!-- Foreground Title and Subtitle Content (Left side, highly readable) -->
  <g transform="translate(60, 0)">
    <!-- Decorative Category Tag -->
    <g transform="translate(0, 55)">
      <rect width="260" height="32" rx="16" fill="url(#cyanGlow)" stroke="#0891b2" stroke-width="1"/>
      <text x="16" y="21" class="badge-text" fill="#cffafe">⚡ AIOPS & OBSERVABILITY ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="140" class="title-text" font-size="40">
      <tspan x="0" dy="0" fill="#ffffff">Awesome Anomaly Detection</tspan>
      <tspan x="0" dy="50" fill="#06b6d4">For Business Ops Metrics 📈🔍</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="240" class="subtitle-text" font-size="16">
      <tspan x="0" dy="0">Curated Directory of KPI Monitors, Time-Series Outlier Engines,</tspan>
      <tspan x="0" dy="26">Root Cause Analysis & Open-Source Alerting Pipelines.</tspan>
    </text>

    <!-- Bottom Feature Pills -->
    <g transform="translate(0, 290)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="135" height="28" rx="6" fill="#1f2937" stroke="#374151"/>
      <text x="12" y="18" class="badge-text" fill="#9ca3af">📊 Time-Series AI</text>

      <!-- Pill 2 -->
      <rect x="147" y="0" width="145" height="28" rx="6" fill="#1f2937" stroke="#374151"/>
      <text x="159" y="18" class="badge-text" fill="#9ca3af">🎯 Business KPIs</text>

      <!-- Pill 3 -->
      <rect x="304" y="0" width="145" height="28" rx="6" fill="#1f2937" stroke="#374151"/>
      <text x="316" y="18" class="badge-text" fill="#9ca3af">🔓 Open-Source & SaaS</text>
    </g>
  </g>
</svg>
